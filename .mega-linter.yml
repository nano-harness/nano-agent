# MegaLinter Configuration
# https://megalinter.io/latest/configuration/
# APPLY_FIXES: all
ENABLE:
  - GO
  - YAML
SHOW_ELAPSED_TIME: true

# Use repository linter config files
GO_GOLANGCI_LINT_CONFIG_FILE: .golangci.yml
GO_REVIVE_CONFIG_FILE: revive.toml

# Upgrade golangci-lint so it is built with the same Go version as the project
# (the version bundled with MegaLinter may lag behind go.mod's Go directive).
PRE_COMMANDS:
  - command: "GOBIN=/usr/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4"
    cwd: "workspace"
