name: Deploy Nano Agent

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/nano_deploy_key
          chmod 600 ~/.ssh/nano_deploy_key
      - name: Mask secrets
        env:
          NANO_API_KEY: ${{ secrets.NANO_API_KEY }}
          NANO_DAEMON_API_KEY: ${{ secrets.NANO_DAEMON_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          SEEDREAM_API_KEY: ${{ secrets.SEEDREAM_API_KEY }}
          NANO_MCP_DEEPWIKI_AUTHORIZATION: ${{ secrets.NANO_MCP_DEEPWIKI_AUTHORIZATION }}
          NANO_MCP_GITHUB_TOKEN: ${{ secrets.NANO_MCP_GITHUB_TOKEN }}
        run: |
          for var in NANO_API_KEY NANO_DAEMON_API_KEY SERPER_API_KEY TAVILY_API_KEY OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET IMAGE_API_KEY SEEDREAM_API_KEY NANO_MCP_DEEPWIKI_AUTHORIZATION NANO_MCP_GITHUB_TOKEN; do
            val=$(printenv "$var")
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done
      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PEM_FILE: ~/.ssh/nano_deploy_key
          DEPLOY_DIR: /opt/nano-agent
          LOCAL_PROJECT_DIR: ${{ github.workspace }}
          API_KEY: ${{ secrets.NANO_DAEMON_API_KEY }}
          DAEMON_PORT: '8080'
          TARGET_OS: linux
          NANO_API_KEY: ${{ secrets.NANO_API_KEY }}
          NANO_BASE_URL: ${{ secrets.NANO_BASE_URL }}
          NANO_MODEL: ${{ secrets.NANO_MODEL }}
          NANO_VERBOSE: ${{ secrets.NANO_VERBOSE }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OSS_ENABLED: ${{ secrets.OSS_ENABLED }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_DEFAULT_BUCKET: ${{ secrets.OSS_DEFAULT_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_TIMEOUT: ${{ secrets.OSS_TIMEOUT }}
          OSS_CALLBACK_URL: ${{ secrets.OSS_CALLBACK_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          SEEDREAM_API_KEY: ${{ secrets.SEEDREAM_API_KEY }}
          SEEDREAM_IMAGE_MODEL: ${{ secrets.SEEDREAM_IMAGE_MODEL }}
          SEEDREAM_BASE_URL: ${{ secrets.SEEDREAM_BASE_URL }}
          NANO_MCP_DEEPWIKI_AUTHORIZATION: ${{ secrets.NANO_MCP_DEEPWIKI_AUTHORIZATION }}
          NANO_MCP_GITHUB_TOKEN: ${{ secrets.NANO_MCP_GITHUB_TOKEN }}
          NANO_DAEMON_PID_FILE: ${{ secrets.NANO_DAEMON_PID_FILE }}
          NANO_DAEMON_LOG_FILE: /opt/nano-agent/logs/daemon.log
          NANO_ENABLE_PPROF: ${{ secrets.NANO_ENABLE_PPROF }}
          NANO_PPROF_PORT: ${{ secrets.NANO_PPROF_PORT }}
          NANO_RESPONSE_TIMEOUT: ${{ secrets.NANO_RESPONSE_TIMEOUT }}
          NANO_HTTP_TIMEOUT: ${{ secrets.NANO_HTTP_TIMEOUT }}
          NANO_CONTEXT_MAX_TOKENS: ${{ secrets.NANO_CONTEXT_MAX_TOKENS }}
          NANO_CONTEXT_COMPRESSION_RATIO: ${{ secrets.NANO_CONTEXT_COMPRESSION_RATIO }}
          NANO_CONTEXT_PRESERVE_RECENT_TURNS: ${{ secrets.NANO_CONTEXT_PRESERVE_RECENT_TURNS }}
          NANO_CONTEXT_ENABLE_COMPRESSION: ${{ secrets.NANO_CONTEXT_ENABLE_COMPRESSION }}
          NANO_REASONING_ENABLED: ${{ secrets.NANO_REASONING_ENABLED }}
          NANO_REASONING_EFFORT: ${{ secrets.NANO_REASONING_EFFORT }}
          NANO_REASONING_MAX_TOKENS: ${{ secrets.NANO_REASONING_MAX_TOKENS }}
          NANO_REASONING_EXCLUDE: ${{ secrets.NANO_REASONING_EXCLUDE }}
          NANO_SANDBOX_ENABLED: ${{ secrets.NANO_SANDBOX_ENABLED || 'true' }}
          NANO_SANDBOX_NETWORK_ACCESS: ${{ secrets.NANO_SANDBOX_NETWORK_ACCESS || 'true' }}
          NANO_SANDBOX_ALLOWED_PATHS: ${{ secrets.NANO_SANDBOX_ALLOWED_PATHS }}
          NANO_SANDBOX_BLOCKED_PATHS: ${{ secrets.NANO_SANDBOX_BLOCKED_PATHS || '/etc,/sys,/proc,/dev' }}
          NANO_SANDBOX_READ_ONLY_PATHS: ${{ secrets.NANO_SANDBOX_READ_ONLY_PATHS }}
          NANO_SANDBOX_EXTRA_READ_ONLY_PATHS: ${{ secrets.NANO_SANDBOX_EXTRA_READ_ONLY_PATHS }}
          NANO_SANDBOX_EXTRA_WRITABLE_PATHS: ${{ secrets.NANO_SANDBOX_EXTRA_WRITABLE_PATHS }}
          NANO_SANDBOX_BWRAP_PATH: ${{ secrets.NANO_SANDBOX_BWRAP_PATH }}
          NANO_ENABLED_TOOLS: ${{ secrets.NANO_ENABLED_TOOLS }}
          NANO_DISABLED_TOOLS: ${{ secrets.NANO_DISABLED_TOOLS }}
          NANO_ALLOWED_COMMANDS: ${{ secrets.NANO_ALLOWED_COMMANDS }}
          NANO_BLOCKED_COMMANDS: ${{ secrets.NANO_BLOCKED_COMMANDS }}
          NANO_ALLOWED_ENV_VARS: ${{ secrets.NANO_ALLOWED_ENV_VARS }}
          NANO_BLOCKED_ENV_VARS: ${{ secrets.NANO_BLOCKED_ENV_VARS }}
          NANO_STRICT: ${{ secrets.NANO_STRICT }}
          NANO_ENABLE_MCP: ${{ secrets.NANO_ENABLE_MCP }}
          NANO_MCP_DEFAULT_TRANSPORT: ${{ secrets.NANO_MCP_DEFAULT_TRANSPORT }}
          NANO_MCP_TIMEOUT: ${{ secrets.NANO_MCP_TIMEOUT }}
          NANO_MCP_MAX_RETRIES: ${{ secrets.NANO_MCP_MAX_RETRIES }}
          NANO_MCP_ENABLE_HEALTH_CHECK: ${{ secrets.NANO_MCP_ENABLE_HEALTH_CHECK }}
          NANO_MCP_HEALTH_CHECK_INTERVAL: ${{ secrets.NANO_MCP_HEALTH_CHECK_INTERVAL }}
          NANO_MCP_HEALTH_CHECK_TIMEOUT: ${{ secrets.NANO_MCP_HEALTH_CHECK_TIMEOUT }}
        run: |
          chmod +x deployment/unified-deploy.sh
          bash deployment/unified-deploy.sh deploy
