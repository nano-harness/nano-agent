name: Go

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod tidy
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          golangci-lint run
      - name: Run tests
        run: go test ./...
      - name: TUI teatest (L2)
        run: go test -race ./pkg/ui/bubbletea/...
      - name: TUI PTY E2E (L3)
        run: go test -race -tags=e2e -timeout=5m ./e2e/tui/...
        env:
          NO_COLOR: "0"
          TERM: "xterm-256color"
